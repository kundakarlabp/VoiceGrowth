name: MedScribe Android APK

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  medscribe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.2.1'

      - name: Unit tests
        run: gradle --no-daemon :scribe:testDebugUnitTest --stacktrace

      - name: Lint
        run: gradle --no-daemon :scribe:lintDebug --stacktrace

      - name: Build debug APK
        run: gradle --no-daemon :scribe:assembleDebug --stacktrace

      - name: APK checksum
        run: sha256sum scribe/build/outputs/apk/debug/scribe-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MedScribe-Local-debug-apk
          path: scribe/build/outputs/apk/debug/scribe-debug.apk
          if-no-files-found: error
          retention-days: 30
